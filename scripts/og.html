<!doctype html>
<!--
  Source for public/og.png (1200×630). To regenerate after a change:
  build the site, then from the project root run
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
    --window-size=1200,630 --screenshot=public/og.png "file://$PWD/scripts/og.html"
-->
<html lang="en">
<meta charset="utf-8">
<title>Open Graph image</title>
<style>
  @font-face { font-family: Plex; src: url("../public/fonts/ibm-plex-sans.woff2"); font-weight: 400 600; }
  @font-face { font-family: PlexMono; src: url("../public/fonts/ibm-plex-mono-400.woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 84px 96px 76px;
    background: #f6f5f1;
    color: #1a1916;
    font-family: Plex, sans-serif;
  }
  h1 { margin: 0; font-size: 92px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
  p { margin: 28px 0 0; font-size: 34px; color: #47453f; }
  footer {
    display: flex;
    justify-content: space-between;
    padding-top: 28px;
    border-top: 2px solid #dddad2;
    font-family: PlexMono, monospace;
    font-size: 26px;
    color: #6b675f;
  }
  footer span:last-child::before {
    content: "";
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 14px;
    background: #8a5a12;
  }
</style>
<body>
  <div>
    <h1>Yasser Mansour</h1>
    <p>Developer. Engineering student at ENSAM Meknès.</p>
  </div>
  <footer>
    <span>El Jadida · Meknès, Morocco</span>
    <span>yassermansour.com</span>
  </footer>
</body>
</html>
